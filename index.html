  .gate{width:100%;max-width:440px;padding:40px 36px 32px;border-radius:20px;background:rgba(6,12,38,.55);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);box-shadow:0 24px 70px rgba(0,0,20,.55)}
  .gate>*{opacity:0;transform:translateY(10px);animation:in .55s ease forwards}
  .gate>:nth-child(2){animation-delay:.08s}.gate>:nth-child(3){animation-delay:.16s}.gate>:nth-child(4){animation-delay:.24s}.gate>:nth-child(5){animation-delay:.32s}
  @keyframes in{to{opacity:1;transform:none}}
  .bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
  .bg video{width:100%;height:100%;object-fit:cover;display:block}
  .gate{position:relative;z-index:1}
  .logo{height:44px;max-width:180px;object-fit:contain;display:block;margin:0 0 26px}
  .badge{display:inline-flex;align-items:center;gap:8px;font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;color:#aebcff;margin-bottom:12px}
  h1{margin:0 0 8px;font-size:1.55rem;line-height:1.25;font-weight:650}
  p{margin:0 0 26px;color:#c5cffa;line-height:1.55;font-size:.95rem}
  .field{position:relative;margin-bottom:14px}
  .field svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:#8fa2f7;fill:none;stroke-width:1.8;pointer-events:none}
  input{width:100%;padding:14px 46px 14px 44px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);color:#fff;font-size:1rem;outline:0;transition:.2s}
  input::placeholder{color:#8fa0e0}
  input:focus{border-color:#6f8dff;background:rgba(255,255,255,.1);box-shadow:0 0 0 3px rgba(79,115,255,.3)}
  .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;background:none;color:#8fa2f7;cursor:pointer;border-radius:8px;display:grid;place-items:center}
  .eye:hover{color:#fff}.eye svg{position:static;transform:none;stroke:currentColor}
  .go{width:100%;padding:14px 20px;border:0;border-radius:12px;font-size:1rem;font-weight:600;color:#fff;cursor:pointer;background:linear-gradient(135deg,#3a63ff,#2346e0);box-shadow:0 8px 24px rgba(40,75,230,.45);transition:.2s}
  .go:hover{filter:brightness(1.1);transform:translateY(-1px)}
  .go:disabled{opacity:.65;cursor:wait;transform:none}
  #err{display:none;margin-top:14px;padding:10px 12px;border-radius:10px;background:rgba(239,68,68,.14);border:1px solid rgba(239,68,68,.4);color:#ffb4b4;font-size:.88rem}
  .shake{animation:shake .35s}
  @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .foot{margin:22px 0 0;font-size:.76rem;color:#8d9bd6;text-align:center}
  @media(max-width:760px){body{justify-content:center;padding:16px}.gate{padding:32px 24px 26px}}
  @media(prefers-reduced-motion:reduce){.bg{display:none}.gate>*{animation:none;opacity:1;transform:none}}
</style>
</head>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pass) {
  const p = JSON.parse(atob(PAYLOAD));
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(p.s), iterations:p.i, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  let buf = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(p.n)}, key, b64(p.c));
  if (p.z) buf = await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer();
  return new TextDecoder().decode(buf);
}
const $ = id => document.getElementById(id);
$("eye").addEventListener("click", () => { const t = $("pw").type === "password"; $("pw").type = t ? "text" : "password"; $("eye").setAttribute("aria-label", t ? "Ocultar senha" : "Mostrar senha"); });
$("f").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = $("go"), err = $("err");
  if (!window.crypto || !crypto.subtle) { err.textContent = "Abra esta página via HTTPS ou direto do arquivo local."; err.style.display = "block"; return; }
  btn.disabled = true; btn.textContent = "Verificando..."; err.style.display = "none";
  try {
    const html = await unlock($("pw").value);
    document.open(); document.write(html); document.close();
  } catch (_) {
    err.textContent = "Senha incorreta. Tente novamente.";
    err.style.display = "block"; $("pw").value = ""; $("pw").focus();
    const g = document.querySelector(".gate"); g.classList.remove("shake"); void g.offsetWidth; g.classList.add("shake");
    btn.disabled = false; btn.textContent = "Acessar conteúdo";
  }
});
